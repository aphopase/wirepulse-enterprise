# Sends port 5000 to whichever Patroni member reports itself leader, and 5001 to the replicas. Patroni answers 200 on /primary only on the leader.
# on-marked-down shutdown-sessions closes the connections to a member the moment it stops being leader, so a demoted server cannot keep serving clients.
global
  maxconn 2000
resolvers docker
  nameserver dns 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 1s
defaults
  mode tcp
  timeout connect 3s
  timeout client 1h
  timeout server 1h
  default-server resolvers docker init-addr last,libc,none inter 1s fall 2 rise 1 on-marked-down shutdown-sessions
listen primary
  bind *:5000
  option httpchk GET /primary
  http-check expect status 200
  server pg1 pg1:5432 check port 8008
  server pg2 pg2:5432 check port 8008
  server pg3 pg3:5432 check port 8008
listen replicas
  bind *:5001
  option httpchk GET /replica
  http-check expect status 200
  server pg1 pg1:5432 check port 8008
  server pg2 pg2:5432 check port 8008
  server pg3 pg3:5432 check port 8008

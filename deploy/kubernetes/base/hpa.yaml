# Needs metrics-server. Scale-down is slow on purpose: live-update streams are dropped (and resumed by the browser) when a pod goes.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: wirepulse-api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: wirepulse-api }
  minReplicas: 3
  maxReplicas: 10
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } } }]
  behavior:
    scaleDown: { stabilizationWindowSeconds: 300, policies: [{ type: Pods, value: 1, periodSeconds: 60 }] }

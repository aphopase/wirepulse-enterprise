# Needs a CNI that enforces NetworkPolicy. Ingress: only from the namespace labelled below (your ingress controller) and from the
# monitoring namespace to /metrics. Egress: DNS, PostgreSQL, Redis, and HTTPS out (identity provider keys, webhooks, SMTP over 587/465).
# Adjust the labels and ports to your cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wirepulse-api
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: wirepulse-api } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
      ports: [{ port: 8080, protocol: TCP }]
  egress:
    - to: [{ namespaceSelector: {}, podSelector: { matchLabels: { k8s-app: kube-dns } } }]
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    - ports: [{ port: 5432, protocol: TCP }, { port: 6379, protocol: TCP }, { port: 443, protocol: TCP }, { port: 587, protocol: TCP }, { port: 465, protocol: TCP }]

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: wirepulse
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - pdb.yaml
  - hpa.yaml
  - networkpolicy.yaml
# migrate-job.yaml is deliberately not listed: it is applied by upgrade.sh before each rollout, see the README.
images:
  - name: wirepulse-api
    newName: wirepulse-api
    newTag: "0.1.0"

# Throwaway test cluster: one control plane, two workers, the API's NodePort published on 127.0.0.1:18800.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings: [{ containerPort: 30080, hostPort: 18800, listenAddress: "127.0.0.1" }]
  - role: worker
  - role: worker

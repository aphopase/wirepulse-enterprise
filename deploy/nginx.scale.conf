# Load balancer for the scale-out example (docker-compose.scale.yml). Docker's DNS answers `api` with the address of every replica;
# nginx re-resolves it every few seconds, so `docker compose up --scale api=N` takes effect without a reload.
# TLS is not terminated here: put your own certificate-bearing proxy or cloud load balancer in front, or add `listen 443 ssl`.
# Open-source nginx has no active health checks and, with a name resolved per request, remembers nothing about a failed replica between
# requests. What bounds the damage when a replica dies or hangs is therefore the timeouts below. For production, prefer a balancer that
# probes /readyz and ejects a replica (cloud load balancer, HAProxy `option httpchk`, Envoy, nginx Plus).
events { worker_connections 4096; }
http {
  access_log off;
  resolver 127.0.0.11 valid=5s ipv6=off;
  server {
    listen 8080;
    # A variable in proxy_pass makes nginx use the resolver above on every request instead of once at start-up.
    set $api http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # This proxy is the edge, so it replaces rather than appends: a client cannot choose the address the API rate-limits.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    # Replicas are on the same network and answer in milliseconds, so a replica that does not accept a connection within 2 s is gone
    # (the default, 60 s, parks every request that picks the dead address for a full minute) and one that sends nothing for 30 s is hung.
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;
    # A replica that is stopping, restarting, gone or hung answers the next one (GET and idempotent calls only; nginx never retries a POST
    # once it has been sent, so a POST in flight when a replica dies fails with 502/504 and the caller retries).
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 3;
    location / {
      proxy_pass $api;
    }
    # Live job updates are Server-Sent Events: the API sends a heartbeat every SSE_HEARTBEAT_MS (15 s by default), so this read timeout
    # only has to be longer than that interval; 1 h covers any SSE_HEARTBEAT_MS (maximum 120 s).
    location ~ ^/v1/workspaces/[^/]+/test-jobs/stream$ {
      proxy_pass $api;
      proxy_read_timeout 1h;
    }
  }
}

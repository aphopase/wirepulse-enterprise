# Load balancer with active health checks, for the scale-out example (docker-compose.scale.yml, profile "haproxy"):
#   docker compose -f docker-compose.yml -f docker-compose.scale.yml --profile haproxy up -d --scale api=6
# Unlike the nginx example it probes every replica's /readyz every 2 s and stops sending traffic to one that fails twice (a replica that
# is frozen, overloaded, cut off from PostgreSQL, or draining on SIGTERM answers /readyz with an error or not at all), and puts it back
# after two successes. Docker's DNS answers `api` with every replica; the server-template follows it, so `--scale api=N` (up to 12 here)
# takes effect without a reload. TLS is not terminated here: put your own certificate-bearing proxy in front, or add `bind :8443 ssl crt ...`.
global
  log stdout format raw local0
  maxconn 4096

defaults
  mode http
  log global
  option httplog
  option dontlognull
  # A replica that does not accept a connection within 2 s is gone; one that sends nothing for 30 s is hung.
  timeout connect 2s
  timeout client 30s
  timeout server 30s
  timeout http-request 10s
  timeout http-keep-alive 60s
  # Take a replica that fails a connection out of the choice for this request and try another one.
  option redispatch 1
  retries 3
  # Retry a request that never reached a replica, and requests that got no answer; the backends below exclude POST from the second kind.
  retry-on conn-failure empty-response response-timeout

resolvers docker
  nameserver dns 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 5s

frontend public
  bind :8080
  # This proxy is the edge, so it replaces rather than appends: a client cannot choose the address the API rate-limits.
  http-request set-header X-Forwarded-For %[src]
  http-request set-header X-Forwarded-Proto http
  acl live_updates path_reg ^/v1/workspaces/[^/]+/test-jobs/stream$
  use_backend api_stream if live_updates
  default_backend api

backend api
  balance roundrobin
  # Never retry a POST that was already sent (it may have run); a failed connection is still retried for every method.
  http-request disable-l7-retry if METH_POST
  option httpchk
  http-check send meth GET uri /readyz
  http-check expect status 200
  default-server check inter 2s fall 2 rise 2 resolvers docker init-addr none
  server-template api 1-12 api:8080

# Live job updates are Server-Sent Events: the API sends a heartbeat every SSE_HEARTBEAT_MS (15 s by default), so the timeouts here
# only have to be longer than that interval; 1 h covers any SSE_HEARTBEAT_MS (maximum 120 s) and the stream's own lifetime limit.
backend api_stream
  balance roundrobin
  timeout server 1h
  timeout tunnel 1h
  http-request disable-l7-retry if METH_POST
  option httpchk
  http-check send meth GET uri /readyz
  http-check expect status 200
  default-server check inter 2s fall 2 rise 2 resolvers docker init-addr none
  server-template api 1-12 api:8080

# Continuous integration for WirePulse. Validate this workflow from the exact commit and runner environment that you operate.
# The workflow has not yet run in this repository. Review failures and pin third-party images by digest before relying on it.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash          # bash -e -o pipefail: a failure inside a pipeline fails the step
env:
  WP_TEST_DATABASE_URL: postgresql://postgres:wptest@127.0.0.1:55432/postgres
  WP_TEST_REDIS_URL: redis://127.0.0.1:56379
  WP_TEST_KEYCLOAK_URL: http://127.0.0.1:18400/realms/wirepulse-test

jobs:
  build:
    name: typecheck, build, gateway tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
            gateway/package-lock.json
      - run: npm ci
      - run: npm ci --prefix gateway
      - run: npm run build
      - name: Gateway tests (4 drive a pseudo-terminal and need python3, which the runner has)
        run: |
          npm test --prefix gateway | tee gateway-test.txt
          grep -q '^# fail 0' gateway-test.txt
          grep -q '^# skipped 0' gateway-test.txt

  api:
    name: API tests (PostgreSQL, Redis, Keycloak)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci --prefix api
      - name: Start disposable PostgreSQL 16, Redis 7 and Keycloak 26
        run: |
          docker run -d --name wp-test-pg -e POSTGRES_PASSWORD=wptest -p 127.0.0.1:55432:5432 postgres:16 -c max_connections=300
          docker run -d --name wp-test-redis -p 127.0.0.1:56379:6379 redis:7
          until docker exec wp-test-pg pg_isready -U postgres; do sleep 1; done
          scripts/test-keycloak.sh
      - name: Run the API suite
        run: |
          npm test --prefix api | tee api-test.txt
          # A skipped test is a test that did not run: the Keycloak, Redis and database tests skip silently without their variables.
          # Exactly 2 skip here: the SAML-bridge tests, which need scripts/test-saml-bridge.sh and a browser (not started in this job).
          grep -q '^# fail 0' api-test.txt
          grep -q '^# skipped 2$' api-test.txt

  browser:
    name: browser tests (Playwright)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
            gateway/package-lock.json
      - run: npm ci
      - run: npm ci --prefix api
      - run: npm ci --prefix gateway
      - run: npx playwright install --with-deps chromium
      - name: Start disposable PostgreSQL, Redis and Keycloak (the SSO sign-in tests need a real provider)
        run: |
          docker run -d --name wp-test-pg -e POSTGRES_PASSWORD=wptest -p 127.0.0.1:55432:5432 postgres:16 -c max_connections=300
          docker run -d --name wp-test-redis -p 127.0.0.1:56379:6379 redis:7
          until docker exec wp-test-pg pg_isready -U postgres; do sleep 1; done
          scripts/test-keycloak.sh
      - name: Start the console dev server and run the tests
        run: |
          npm run dev > vite.log 2>&1 &
          for _ in $(seq 1 60); do curl -fs http://127.0.0.1:5173/ >/dev/null && break; sleep 1; done
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: |
            test-results
            vite.log

  dependencies:
    name: dependency audit and SBOM
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm ci --prefix api
      - run: npm ci --prefix gateway
      - name: npm audit (fails on high or critical)
        run: |
          npm audit --audit-level=high
          npm audit --audit-level=high --prefix api
          npm audit --audit-level=high --prefix gateway
      - name: Software bill of materials
        run: scripts/sbom.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom

  image:
    name: container image scan (Trivy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -t wirepulse-api:ci api
      # The kind-test overlay is a throwaway test cluster (a vendored metrics-server patched for kind, a bare Postgres); it is not a deployment example.
      - name: Scan the repository (lockfiles, Dockerfile, secrets)
        run: docker run --rm -v "$PWD:/src:ro" aquasec/trivy:latest fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 1 --skip-dirs /src/deploy/kubernetes/overlays/kind-test /src
      - name: Scan the image
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --severity HIGH,CRITICAL --exit-code 1 wirepulse-api:ci
  acceptance:
    name: installation acceptance (docker compose, development mode)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install the way the guide says, in development mode
        run: |
          ./scripts/init-secrets.sh ./secrets
          {
            echo "NODE_ENV=development"
            echo "DEV_BEARER_TOKEN=ci-$(openssl rand -hex 24)"
            echo "METRICS_TOKEN=$(openssl rand -hex 16)"
            echo "CORS_ORIGINS=http://localhost:5173"
            echo "API_PORT=18080"
          } > .env
          docker compose up -d --build
          for _ in $(seq 1 60); do curl -fs http://127.0.0.1:18080/readyz >/dev/null && break; sleep 2; done
          curl -fs http://127.0.0.1:18080/readyz
      - name: Acceptance script
        run: |
          set -a; . ./.env; set +a
          node scripts/acceptance.mjs --url http://127.0.0.1:18080 --token "$DEV_BEARER_TOKEN" --metrics-token "$METRICS_TOKEN"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -n 200

  # Active scan against a throwaway API; run it by hand (Actions > ci > Run workflow), not on every push.
  zap:
    name: OWASP ZAP scan (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Start a throwaway API in development mode
        run: |
          ./scripts/init-secrets.sh ./secrets
          {
            echo "NODE_ENV=development"
            echo "DEV_BEARER_TOKEN=ci-$(openssl rand -hex 24)"
            echo "CORS_ORIGINS=http://localhost:5173"
            echo "API_PORT=18080"
          } > .env
          docker compose up -d --build
          for _ in $(seq 1 60); do curl -fs http://127.0.0.1:18080/readyz >/dev/null && break; sleep 2; done
          curl -fs http://127.0.0.1:18080/readyz
      - name: Scan with a user token
        run: |
          set -a; . ./.env; set +a
          workspace=$(curl -fs -X POST http://127.0.0.1:18080/v1/workspaces -H "authorization: Bearer $DEV_BEARER_TOKEN" -H 'content-type: application/json' -d '{"name":"zap-ci"}' | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).id')
          scripts/zap-scan.sh http://127.0.0.1:18080 "$DEV_BEARER_TOKEN" "$workspace" zap-reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-reports
          path: zap-reports
